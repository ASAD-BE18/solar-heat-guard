<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>solar-heat-guard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
      crossorigin="anonymous" />
<style>
  html, body, #map { height: 100%; margin: 0; }
  #panel {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: rgba(255,255,255,0.95); padding: 12px 14px; border-radius: 8px;
    font-family: system-ui, sans-serif; font-size: 13px; max-width: 260px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }
  #panel h1 { font-size: 15px; margin: 0 0 6px; }
  #panel .legend-item { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #panel .swatch { width: 14px; height: 14px; border-radius: 2px; flex: none; }
  #panel .stat { margin-top: 8px; color: #333; }
  #panel .toggle-row { display: flex; align-items: center; gap: 6px; margin: 8px 0 2px; }
  #panel .caveat { margin-top: 8px; color: #666; font-size: 11px; line-height: 1.35; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>solar-heat-guard</h1>
  <div class="toggle-row">
    <input type="checkbox" id="overlay-toggle" checked>
    <label for="overlay-toggle">Show risk overlay</label>
  </div>
  <div id="meta" class="stat"></div>
  <div id="legend"></div>
  <div id="stats" class="stat"></div>
  <div id="caveat" class="caveat"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
        crossorigin="anonymous"></script>
<script src="data.js"></script>
<script>
// PANEL_ROWS features may carry either the PV-model properties
// (cell_temperature_c, power_loss_percent, at_risk) or the simpler
// tcm/exceedance properties (tile_value, at_risk) -- render whichever
// is present rather than assuming one schema.
function hasPvModel(features) {
  return features.some(f => f.properties.cell_temperature_c != null);
}

const NO_DATA_COLOR = "#9e9e9e";

// at_risk is deliberately three-state: true / false / null. A row whose
// centroid fell in no heatmap tile is UNKNOWN, not safe, and must never
// render in the same colour as a row we actually measured and cleared.
function rowColor(props, pvModel, colorLo, colorHi) {
  if (props.at_risk == null) return NO_DATA_COLOR;
  if (!pvModel) return props.at_risk ? "#d73027" : "#4575b4";
  const t = props.cell_temperature_c;
  if (t == null) return NO_DATA_COLOR;
  // blue (cool) -> yellow -> red (hot), scaled from 25C (STC reference) up
  // to the configured max-operating-temp risk cutoff, so the gradient
  // actually reflects "how close to the risk threshold", not an arbitrary
  // fixed range that can make a genuinely hot cell read as pale/cool.
  const lo = colorLo, hi = colorHi;
  const frac = Math.max(0, Math.min(1, (t - lo) / (hi - lo)));
  const r = Math.round(255 * Math.min(1, frac * 2));
  const g = Math.round(255 * (1 - Math.abs(frac - 0.5) * 2));
  const b = Math.round(255 * Math.min(1, (1 - frac) * 2));
  return `rgb(${r},${g},${b})`;
}

const map = L.map("map");
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
  maxZoom: 20,
}).addTo(map);

L.geoJSON(SITE_BOUNDARY, {
  style: { color: "#333", weight: 2, fillOpacity: 0 },
}).addTo(map);

const pvModel = hasPvModel(PANEL_ROWS.features);
const md = PANEL_ROWS.metadata;
const colorLo = 25; // STC reference temperature
const colorHi = (md && md.max_operating_temp_c) || 90;

const rowsLayer = L.geoJSON(PANEL_ROWS, {
  style: f => {
    const c = rowColor(f.properties, pvModel, colorLo, colorHi);
    return { color: c, weight: 1, fillColor: c, fillOpacity: 0.55 };
  },
  onEachFeature: (f, layer) => {
    const p = f.properties;
    let html = `<b>Row ${p.row_id}</b>`;
    if (p.tile_id != null) html += ` <span style="color:#777">(tile ${p.tile_id})</span>`;
    html += "<br>";
    if (p.at_risk == null) {
      html += `<i>No heatmap tile covers this row &mdash; unknown, not cleared.</i>`;
    } else {
      if (pvModel) {
        html += `Ambient: ${p.ambient_temperature_c?.toFixed(1)} &deg;C<br>`;
        html += `GHI: ${p.ghi_w_m2?.toFixed(0)} W/m&sup2;<br>`;
        html += `Cell temp: ${p.cell_temperature_c?.toFixed(1)} &deg;C<br>`;
        html += `Power loss: ${p.power_loss_percent?.toFixed(1)}%<br>`;
      } else {
        html += `${p.value_field}: ${p.tile_value}<br>`;
      }
      const flagLabel = (md && md.risk_percentile != null) ? "HOTSPOT" : "AT RISK";
      html += `<b>${p.at_risk ? flagLabel : "ok"}</b>`;
    }
    layer.bindPopup(html);
  },
}).addTo(map);

map.fitBounds(rowsLayer.getBounds());

document.getElementById("overlay-toggle").addEventListener("change", e => {
  if (e.target.checked) {
    rowsLayer.addTo(map);
  } else {
    map.removeLayer(rowsLayer);
  }
});

const props = PANEL_ROWS.features.map(f => f.properties);
const atRiskCount = props.filter(p => p.at_risk === true).length;
const noDataCount = props.filter(p => p.at_risk == null).length;
const scoredCount = props.length - noDataCount;
const flagWord = (md && md.risk_percentile != null) ? "flagged as hotspots" : "at risk";

// Denominator is SCORED rows, not all rows -- folding unmeasurable rows into
// the denominator would quietly understate the at-risk rate.
let statsHtml = `${atRiskCount} / ${scoredCount} scored rows ${flagWord}`;
if (noDataCount) statsHtml += `<br><span style="color:#666">${noDataCount} row(s) with no data (not counted)</span>`;
if (pvModel) {
  const losses = props.map(p => p.power_loss_percent).filter(v => v != null);
  const temps = props.map(p => p.cell_temperature_c).filter(v => v != null);
  const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
  if (losses.length) {
    statsHtml += `<br><b>Avg cell temp:</b> ${avg(temps).toFixed(1)}&deg;C`;
    statsHtml += `<br><b>Avg power loss:</b> ${avg(losses).toFixed(1)}%`;
  }
}
document.getElementById("stats").innerHTML = statsHtml;

if (md) {
  const timeWindow = md.end_time ? `${md.start_time}–${md.end_time}` : md.start_time;
  let lines = [
    `<b>Date:</b> ${md.date} ${timeWindow}`,
    `<b>Analysis:</b> ${md.analytic_type}${md.direction ? " (" + md.direction + ")" : ""}`,
    `<b>Granularity:</b> ${md.granularity_m} m`,
  ];
  if (md.pv_model) {
    lines.push(`<b>PV model:</b> NOCT=${md.noct_c}&deg;C, coeff=${md.temp_coeff_pct_per_c}%/&deg;C`);
    lines.push(`<b>Risk cutoff:</b> cell temp ≥ ${md.max_operating_temp_c}&deg;C`);
  } else if (md.risk_percentile != null) {
    lines.push(`<b>Metric:</b> hours above ${md.threshold}&deg;C (site's own measured average)`);
    // The percentile is taken over ROWS, not over distinct tiles -- the two
    // give materially different cutoffs, so the label has to say which.
    lines.push(`<b>Hotspot cutoff:</b> top ${(100 - md.risk_percentile).toFixed(0)}% of this site's own rows (&ge; ${md.percentile_cutoff?.toFixed(2)} hrs)`);
  } else if (md.analytic_type === "tcm") {
    lines.push(`<b>Risk cutoff:</b> ${md.threshold}&deg;C`);
  } else {
    lines.push(`<b>Risk cutoff:</b> &ge; ${md.threshold} hrs`);
  }
  let geom = `${md.row_pitch_m}m pitch, ${md.row_width_m}m width`;
  if (md.row_offset_m != null) geom += `, ${md.row_offset_m}m phase`;
  lines.push(`<b>Row geometry:</b> ${geom} (measured from imagery)`);
  document.getElementById("meta").innerHTML = lines.join("<br>");

  // Rows are far finer than the heatmap tiles they are coloured from; say so
  // rather than letting the per-row rendering imply per-row measurement.
  if (md.n_tiles_with_rows && md.granularity_m) {
    document.getElementById("caveat").innerHTML =
      `Rows are ${md.row_pitch_m} m apart but temperature comes from ` +
      `${md.granularity_m} m tiles &mdash; ${scoredCount} rows are coloured from ` +
      `${md.n_tiles_with_rows} distinct tile values, so neighbouring rows often share one measurement.`;
  }
} else {
  document.getElementById("meta").textContent = "(no run metadata in this dataset)";
}

const legend = document.getElementById("legend");
if (pvModel) {
  legend.innerHTML = `
    <div class="legend-item"><div class="swatch" style="background:rgb(0,0,255)"></div>${colorLo}&deg;C</div>
    <div class="legend-item"><div class="swatch" style="background:rgb(255,255,0)"></div>${Math.round((colorLo + colorHi) / 2)}&deg;C</div>
    <div class="legend-item"><div class="swatch" style="background:rgb(255,0,0)"></div>${colorHi}&deg;C (risk cutoff)</div>`;
} else {
  legend.innerHTML = `
    <div class="legend-item"><div class="swatch" style="background:#d73027"></div>${flagWord}</div>
    <div class="legend-item"><div class="swatch" style="background:#4575b4"></div>ok</div>`;
}
if (noDataCount) {
  legend.innerHTML += `
    <div class="legend-item"><div class="swatch" style="background:${NO_DATA_COLOR}"></div>no data (unknown)</div>`;
}
</script>
</body>
</html>
